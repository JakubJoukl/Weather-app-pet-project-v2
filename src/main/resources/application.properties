spring.application.name=WeatherAppPetProjectV2
server.servlet.context-path=/api

#Data source
spring.datasource.url=jdbc:mysql://localhost:3306/weatherApp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=reporter
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#zbytecne s liquibase
spring.jpa.hibernate.naming.physical-strategy=com.example.weatherapppetprojectv2.config.UpperCaseSnakeNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.hibernate.SpringImplicitNamingStrategy

#Redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379
##spring.data.redis.password=
spring.data.redis.database=0

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
